[project]
name = "photographer-assistant-web"
version = "0.1.0"
description = "Web version of Photographer Assistant - gallery management for photographers"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pillow>=11.0.0",
    "boto3>=1.35.0",
    "aiofiles>=24.1.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "bleach>=6.0.0",
    "resend>=2.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
